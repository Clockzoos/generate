<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock- Hub - Key Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
        background: radial-gradient(circle at center, #1e1e2f 0%, #0d0d15 100%);
        color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
    }
    .card {
        background: rgba(28, 28, 36, 0.85); backdrop-filter: blur(12px); padding: 40px 30px;
        border-radius: 20px; text-align: center; width: 100%; max-width: 400px;
        border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    h2 { font-size: 24px; color: #fff; margin-bottom: 5px; }
    p { font-size: 13px; color: #9494a0; margin-bottom: 20px; line-height: 1.5; }
    .gen-btn {
        background: linear-gradient(135deg, #5865f2, #4752c4); color: white; border: none;
        padding: 14px 20px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer;
        width: 100%; transition: 0.3s; box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
        margin-bottom: 15px; text-decoration: none; display: inline-block;
    }
    .gen-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(88, 101, 242, 0.6); }
    .gen-btn:disabled { background: #3c3c4f; cursor: not-allowed; box-shadow: none; opacity: 0.7; }
    
    input {
        width: 100%; padding: 12px; background: rgba(15, 15, 20, 0.8);
        border: 1.5px solid #2d2d3b; color: #43e97b; border-radius: 10px;
        text-align: center; font-size: 14px; font-weight: 600; margin-top: 10px; outline: none;
    }
    .limit-info { font-size: 12px; color: #facc15; margin-top: 10px; }
</style>
</head>
<body>

<div class="card">
    <h2>CLOCK- HUB</h2>
    <p id="descText">Please complete Linkvertise to start generating keys.</p>
    
    <div id="mainContainer">
        <!-- Tombol Linkvertise yang otomatis menyelipkan token saat diklik -->
        <a href="https://link-hub.net/7791978/7v5R3sGQl4S1" onclick="triggerLinkvertise()" class="gen-btn" style="background: #eab308; color:#000;">Complete Linkvertise</a>
    </div>
    
    <div id="resultBox" style="display: none;">
        <input type="text" id="keyOutput" readonly>
    </div>
    
    <div class="limit-info" id="limitText" style="display: none;">Generation quota left: 2/2</div>
</div>

<script>
    const BIN_ID = "6af7f649ac6210605a868c2b";
    const MASTER_KEY = "$2a$10$7kUozSyzkNytbUxnN7/kv.xInV14ItUgvNAWdjKEswZ0M.DDWgL/e";

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    let sessionData = JSON.parse(localStorage.getItem("clock_session") || "null");
    let now = Date.now();

    // Jika user kembali dari Linkvertise membawa token, aktifkan sesi 2 jam
    if (token === "success") {
        sessionData = { startTime: now, count: 0 };
        localStorage.setItem("clock_session", JSON.stringify(sessionData));
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Cek apakah sesi sudah kedaluwarsa (> 2 jam / 7200000 ms)
    if (!sessionData || (now - sessionData.startTime > 7200000)) {
        sessionData = { startTime: 0, count: 2 }; 
        localStorage.setItem("clock_session", JSON.stringify(sessionData));
    }

    updateUI();

    // Fungsi ini otomatis merubah link tombol agar mengarah kembali ke website kamu dengan membawa token sukses
    function triggerLinkvertise() {
        let currentUrl = window.location.origin + window.location.pathname;
        let targetLink = "https://link-hub.net/7791978/7v5R3sGQl4S1"; 
        // Catatan: Sebagian besar sistem Linkvertise menggunakan parameter ?r= atau langsung kembali ke destination URL.
        // Jika destination URL di Linkvertise diset ke https://Clockzoos.github.io/generate, 
        // kita bisa akali dengan mendeteksi klik atau menggunakan localStorage state.
        localStorage.setItem("clock_pending_session", "true");
    }

    // Jika user baru balik dari luar (dianggap selesai dari Linkvertise berdasarkan state pending)
    if (localStorage.getItem("clock_pending_session") === "true") {
        localStorage.removeItem("clock_pending_session");
        sessionData = { startTime: now, count: 0 };
        localStorage.setItem("clock_session", JSON.stringify(sessionData));
        window.location.reload();
    }

    function updateUI() {
        let remaining = 2 - sessionData.count;
        if (remaining < 0) remaining = 0;

        const mainContainer = document.getElementById("mainContainer");
        const descText = document.getElementById("descText");
        const limitText = document.getElementById("limitText");

        if (sessionData.startTime > 0 && remaining > 0) {
            descText.textContent = "Generate your exclusive key here. Maximum 2 key generations per session.";
            limitText.style.display = "block";
            limitText.textContent = `Generation quota left: ${remaining}/2`;
            mainContainer.innerHTML = `<button class="gen-btn" id="genBtn" onclick="generateKey()">Generate New Key</button>`;
        } else {
            descText.textContent = "Your session is locked or expired. Please complete Linkvertise to unlock!";
            limitText.style.display = "none";
            mainContainer.innerHTML = `<a href="https://link-hub.net/7791978/7v5R3sGQl4S1" onclick="triggerLinkvertise()" class="gen-btn" style="background: #eab308; color:#000; text-decoration:none;">Complete Linkvertise</a>`;
        }
    }

    function generateRandomString() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let result = "";
        for (let i = 0; i < 12; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return "CLOCK-" + result;
    }

    async function generateKey() {
        if (sessionData.count >= 2) return;

        const genBtn = document.getElementById("genBtn");
        if(genBtn) {
            genBtn.disabled = true;
            genBtn.textContent = "Processing...";
        }

        const newKey = generateRandomString();
        const expireTime = Date.now() + (24 * 60 * 60 * 1000); 

        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            let result = await response.json();
            let keysArray = result.record.keys || [];

            let currentTime = Date.now();
            keysArray = keysArray.filter(item => item.expire > currentTime);

            keysArray.push({ key: newKey, expire: expireTime });

            let updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify({ keys: keysArray })
            });

            if (updateResponse.ok) {
                sessionData.count++;
                localStorage.setItem("clock_session", JSON.stringify(sessionData));

                document.getElementById("keyOutput").value = newKey;
                document.getElementById("resultBox").style.display = "block";
                updateUI();
            } else {
                alert("Failed to save key to server.");
                if(genBtn) {
                    genBtn.disabled = false;
                    genBtn.textContent = "Generate New Key";
                }
            }
        } catch (e) {
            console.error(e);
            alert("Network error.");
            if(genBtn) {
                genBtn.disabled = false;
                genBtn.textContent = "Generate New Key";
            }
        }
    }
</script>

</body>
</html>
