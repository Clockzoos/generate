<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEZC-HYB Key Generator</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/XZJcwxzw/0f94800fa0049e5dad9ebc027bd54e3c.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --surface: #050505;
            --surface-hover: #111111;
            --color-primary: #eab308;
            --color-primary-hover: #ca8a04;
            --color-primary-dim: rgba(234, 179, 8, 0.1);
            --color-border: #1a1a1a;
            --color-text: #ffffff;
            --color-text-muted: #a0a0a0;
            --color-success: #22c55e;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); cursor: pointer; }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-primary);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 2px solid var(--color-primary);
            box-shadow: 0 0 15px var(--color-primary-dim);
        }

        h2 { font-size: 22px; margin-bottom: 8px; color: #fff; font-weight: 700; }
        p { font-size: 13px; color: var(--color-text-muted); margin-bottom: 24px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        .input-field {
            width: 100%; padding: 13px 16px; background: var(--bg-secondary);
            border: 1px solid var(--color-border); color: #fff; border-radius: 12px; font-size: 14px;
            transition: 0.2s;
        }
        .input-field:focus { border-color: var(--color-primary); background: #000; outline: none; box-shadow: 0 0 10px var(--color-primary-dim); }

        .btn {
            background: var(--color-primary); color: #000; border: none;
            padding: 13px 20px; border-radius: 12px; font-weight: 700; cursor: pointer;
            width: 100%; font-size: 14px; transition: 0.2s; margin-top: 10px;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: var(--color-primary-hover); transform: translateY(-2px); }

        .btn-success { background: var(--color-success); color: #fff; }
        .btn-success:hover { background: #16a34a; }

        .result-box {
            margin-top: 20px; background: var(--bg-secondary); border: 1px dashed var(--color-primary);
            padding: 16px; border-radius: 12px; font-family: monospace; font-size: 14px;
            color: var(--color-primary); word-break: break-all; display: none;
        }

        .footer-note {
            margin-top: 24px; font-size: 11px; color: var(--color-text-muted);
            border-top: 1px solid var(--color-border); padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.ibb.co.com/XZJcwxzw/0f94800fa0049e5dad9ebc027bd54e3c.jpg" class="logo" alt="Logo">
        <h2 id="page-title">VEZC-HYB Key System</h2>
        <p id="page-desc">Generate your secure 24-hour key to access the script hub.</p>

        <!-- STEP 1: CREATE GENERATOR PAGE -->
        <div id="generator-view">
            <div class="form-group">
                <label>Your Custom Hub / Username Name</label>
                <input type="text" id="owner-name" class="input-field" placeholder="e.g. Clock">
            </div>
            <button class="btn" onclick="createGeneratorPage()">Create My Generator Link</button>
        </div>

        <!-- STEP 2: USER KEY GENERATOR -->
        <div id="user-view" style="display:none;">
            <div style="margin-bottom: 20px; font-size: 13px; color: var(--color-text-muted); background: var(--bg-secondary); padding: 10px; border-radius: 8px; border: 1px solid var(--color-border);">
                Generating key for Hub: <strong id="display-owner" style="color: var(--color-primary);"></strong>
            </div>
            <button class="btn" onclick="generateUserKey()">🔑 Generate Key Now</button>
            
            <div id="result-container" class="result-box">
                <div id="generated-key-text" style="margin-bottom: 10px; font-weight: bold; color: #fff;"></div>
                <button class="btn btn-success" style="padding: 10px;" onclick="copyKey()">📋 Copy Key</button>
            </div>
        </div>

        <div class="footer-note">
            Protected by VEZC-HYB Security Server
        </div>
    </div>

    <!-- Libraries -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBkLQc3Lhn9Rnq2NTMezoW0eTfNDyFIFyw",
          authDomain: "key-server-af0df.firebaseapp.com",
          projectId: "key-server-af0df",
          storageBucket: "key-server-af0df.firebasestorage.app",
          messagingSenderId: "464032962986",
          appId: "1:464032962986:web:d6abf41d878fa32102f3d3"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);

        window.app = {
            owner: "",

            init() {
                const hash = window.location.hash.replace("#", "").trim();
                if (hash) {
                    this.owner = hash;
                    document.getElementById('generator-view').style.display = 'none';
                    document.getElementById('user-view').style.display = 'block';
                    document.getElementById('display-owner').textContent = this.owner;
                    document.getElementById('page-title').textContent = `${this.owner}'s Key System`;
                }
            }
        };

        window.createGeneratorPage = function() {
            const name = document.getElementById('owner-name').value.trim();
            if (!name) {
                Swal.fire('Error', 'Please enter your name or hub identifier!', 'error');
                return;
            }
            window.location.hash = "#" + name;
            location.reload();
        }

        window.generateUserKey = async function() {
            const owner = window.app.owner;
            const r1 = Math.floor(1000 + Math.random() * 9000);
            const r2 = Math.floor(1000 + Math.random() * 9000);
            const r3 = Math.floor(1000 + Math.random() * 9000);
            
            // Format Key: nama-XXXX-XXXX-XXXX
            const newKey = `${owner}-${r1}-${r2}-${r3}`;
            const expiryTime = Math.floor(Date.now() / 1000) + (24 * 60 * 60); // Berlaku 24 jam

            try {
                // Simpan key otomatis ke database 'key-server-af0df' di koleksi 'keys'
                await setDoc(doc(db, "keys", newKey), {
                    key: newKey,
                    owner: owner,
                    expiryTime: expiryTime,
                    used: false,
                    created: new Date().toISOString()
                });

                document.getElementById('generated-key-text').textContent = newKey;
                document.getElementById('result-container').style.display = 'block';
                
                Toastify({ 
                    text: "Key generated successfully!", 
                    duration: 3000, 
                    style: { background: "#eab308", color: "#000", fontWeight: "bold" } 
                }).showToast();
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Failed to generate key. Please try again!', 'error');
            }
        }

        window.copyKey = function() {
            const keyText = document.getElementById('generated-key-text').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                Toastify({ 
                    text: "Key copied to clipboard!", 
                    duration: 2000, 
                    style: { background: "#22c55e", color: "#fff", fontWeight: "bold" } 
                }).showToast();
            });
        }

        window.app.init();
    </script>
</body>
</html>
